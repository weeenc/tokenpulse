limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server_tokens off;
server {
  listen 8080;
  server_name tokenpulse.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 8443 ssl http2;
  server_name tokenpulse.example.com;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 2m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://tokenpulse-server:8080;
  }
  location /health { proxy_pass http://tokenpulse-server:8080; }
  location / {
    proxy_set_header Host $host;
    proxy_pass http://tokenpulse-web:8080;
  }
}
