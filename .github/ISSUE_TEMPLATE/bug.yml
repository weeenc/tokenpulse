name: Bug report
description: 报告可复现的问题
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 Device Token、JWT、Prompt、AI 回复、源码或其他敏感信息。
  - type: dropdown
    id: component
    attributes:
      label: 组件
      options: [tokenpulse-agent, tokenpulse-server, tokenpulse-web, deployment]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的 diagnostics
