name: Feature request
description: 提议新功能或改进
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 主要组件
      options: [tokenpulse-agent, tokenpulse-server, tokenpulse-web, deployment, documentation]
    validations:
      required: true
