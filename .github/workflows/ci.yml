name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage --workspace tokenpulse-web

  agent-platforms:
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace tokenpulse-agent
      - run: npm test --workspace tokenpulse-agent
      - run: npm pack --dry-run --workspace tokenpulse-agent

  go:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tokenpulse_test
          MYSQL_USER: tokenpulse
          MYSQL_PASSWORD: tokenpulse
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: tokenpulse-server
    env:
      MYSQL_TEST_DSN: tokenpulse:tokenpulse@tcp(127.0.0.1:3306)/tokenpulse_test?charset=utf8mb4&parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tokenpulse-server/go.mod
          cache-dependency-path: tokenpulse-server/go.sum
      - run: go test -race ./...
      - run: go vet ./...

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tokenpulse-server/Dockerfile
          push: false
          tags: tokenpulse-server:ci
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: tokenpulse-web/Dockerfile
          push: false
          tags: tokenpulse-web:ci
      - run: docker compose -f deploy/docker-compose.yml config --quiet
        env:
          TOKENPULSE_ENV_FILE: .env.example
          MYSQL_DATABASE: token_usage
          MYSQL_USERNAME: tokenpulse
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
